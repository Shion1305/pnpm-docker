name: "Build and push pnpm image"
on:
  push:
    branches:
      - 'main'
jobs:
  find-changed-dirs:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.get-changes.outputs.tags }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed directories
      id: get-changes
      run: |
        BEFORE_COMMIT=${{ github.event.before }}
        CURRENT_COMMIT=${{ github.sha }}
        # Get the list of changed directories under the images folder
        CHANGED_DIRS=$(git diff --name-only $BEFORE_COMMIT $CURRENT_COMMIT | grep '^images/' | cut -d/ -f2 | sort | uniq)
        echo "Changed directories: $CHANGED_DIRS"
        # if there are no changes, set an empty array
        if [ -z "$CHANGED_DIRS" ]; then
          TAGS="[]"
        else
          # Convert the list to JSON array format
          TAGS=$(printf '%s\n' "$CHANGED_DIRS" | jq -R . | jq -sc .)
        fi
        echo "tags=$TAGS"
        echo "tags=$TAGS" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: find-changed-dirs
    strategy:
      matrix:
        tag: ${{ fromJson(needs.find-changed-dirs.outputs.tags) }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: shion1305/pnpm:${{ matrix.tag }}
          file: ./Dockerfile
          context: ./images/${{ matrix.tag }}
          platforms: linux/amd64,linux/arm64
