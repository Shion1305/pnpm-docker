name: "Build and push pnpm image"
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
jobs:
  build-test-push-images:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        tag: ["22", "22-alpine"]
        runner: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Build Docker image
        run: |
          docker build -t pnpm-image:latest ./images/${{ matrix.tag }}
      - name: Building Sample Application
        run: |
          docker build -f ./sample-app/Dockerfile ./sample-app/next-app
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push Docker Image
        run: |
          docker tag pnpm-image:latest ${{ vars.DOCKERHUB_USERNAME }}/pnpm:${{ matrix.tag }}-${{ matrix.runner }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/pnpm:${{ matrix.tag }}-${{ matrix.runner }}
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ vars.DOCKERHUB_USERNAME }}/pnpm:${{ matrix.tag }}-${{ matrix.runner }})"
